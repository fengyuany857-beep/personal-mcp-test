name: Deploy 12306 Readonly Runner to Railway

on:
  workflow_dispatch:
  push:
    branches:
      - feat/12306-ticket-capability
    paths:
      - RAILWAY_12306_DEPLOY_TRIGGER

permissions:
  contents: read

concurrency:
  group: railway-12306-readonly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_NAME: rail12306-readonly

    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify Railway project token is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || { echo "RAILWAY_TOKEN secret is missing" >&2; exit 1; }

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @railway/cli@5.57.7
          railway --version

      - name: Derive and mask runner-only secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { hkdfSync } = require('node:crypto');

          const token = process.env.RAILWAY_TOKEN;
          if (!token) throw new Error('RAILWAY_TOKEN_MISSING');
          const salt = Buffer.from('personal-mcp-12306-railway-v1', 'utf8');
          const derive = (info) => Buffer.from(hkdfSync('sha256', Buffer.from(token, 'utf8'), salt, Buffer.from(info, 'utf8'), 32));

          const admin = derive('runner-admin-token').toString('base64url');
          const alias = derive('passenger-alias-key').toString('base64url');
          const session = derive('session-aes-256-gcm-key').toString('base64');

          for (const value of [admin, alias, session]) process.stdout.write(`::add-mask::${value}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RUNNER_ADMIN_TOKEN=${admin}\nRAIL12306_ALIAS_KEY=${alias}\nRAIL12306_SESSION_KEY_B64=${session}\n`);
          NODE

      - name: Resolve project and ensure bounded service with GraphQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const endpoint = 'https://backboard.railway.com/graphql/v2';
          const token = process.env.RAILWAY_TOKEN;
          const serviceName = process.env.SERVICE_NAME;

          async function gql(query, variables = {}) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Project-Access-Token': token,
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) {
              const messages = (body.errors || []).map((e) => e.message).join(' | ');
              throw new Error(`RAILWAY_GRAPHQL_ERROR:${response.status}:${messages || 'unknown'}`);
            }
            return body.data;
          }

          async function main() {
            const tokenInfo = await gql('query { projectToken { projectId environmentId } }');
            const projectId = tokenInfo.projectToken?.projectId;
            const environmentId = tokenInfo.projectToken?.environmentId;
            if (!projectId || !environmentId) throw new Error('RAILWAY_PROJECT_TOKEN_SCOPE_NOT_FOUND');

            const projectData = await gql(
              'query($id: String!) { project(id: $id) { services { edges { node { id name } } } } }',
              { id: projectId },
            );
            let service = projectData.project.services.edges.map((edge) => edge.node).find((item) => item.name === serviceName);
            if (!service) {
              const created = await gql(
                'mutation($input: ServiceCreateInput!) { serviceCreate(input: $input) { id name } }',
                { input: { projectId, environmentId, name: serviceName } },
              );
              service = created.serviceCreate;
              console.log('service_created=true');
            } else {
              console.log('service_exists=true');
            }
            if (!service?.id) throw new Error('RAILWAY_SERVICE_ID_NOT_FOUND');

            fs.appendFileSync(process.env.GITHUB_ENV,
              `RAILWAY_PROJECT_ID=${projectId}\nRAILWAY_ENVIRONMENT_ID=${environmentId}\nRAILWAY_SERVICE_ID=${service.id}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Configure runner variables with GraphQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://backboard.railway.com/graphql/v2';
          const token = process.env.RAILWAY_TOKEN;
          async function gql(query, variables) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Project-Access-Token': token,
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) {
              const messages = (body.errors || []).map((e) => e.message).join(' | ');
              throw new Error(`RAILWAY_GRAPHQL_ERROR:${response.status}:${messages || 'unknown'}`);
            }
            return body.data;
          }

          const values = {
            RUNNER_ADMIN_TOKEN: process.env.RUNNER_ADMIN_TOKEN,
            RAIL12306_ACCOUNT_REF: 'acct_primary',
            RAIL12306_ALIAS_KEY: process.env.RAIL12306_ALIAS_KEY,
            RAIL12306_SESSION_KEY_B64: process.env.RAIL12306_SESSION_KEY_B64,
            RAIL12306_STATE_DIR: '/data',
            RAILWAY_DOCKERFILE_PATH: 'Dockerfile.railway',
          };
          const mutation = 'mutation($input: VariableUpsertInput!) { variableUpsert(input: $input) }';
          for (const [name, value] of Object.entries(values)) {
            await gql(mutation, {
              input: {
                projectId: process.env.RAILWAY_PROJECT_ID,
                environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
                serviceId: process.env.RAILWAY_SERVICE_ID,
                name,
                value,
              },
            });
          }
          console.log('runner_variables_configured=true');
          NODE

      - name: Ensure one persistent /data volume
        shell: bash
        run: |
          set -euo pipefail
          railway volume \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            list \
            --json > /tmp/volumes.json
          if jq -e '.. | objects | select(.mountPath? == "/data")' /tmp/volumes.json >/dev/null; then
            echo "data_volume_exists=true"
          else
            railway volume \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              add \
              --mount-path /data \
              --json > /tmp/volume-create.json
            echo "data_volume_created=true"
          fi

      - name: Configure read-only health, restart and single Singapore replica
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://backboard.railway.com/graphql/v2';
          const token = process.env.RAILWAY_TOKEN;
          async function gql(query, variables) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Project-Access-Token': token,
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) {
              const messages = (body.errors || []).map((e) => e.message).join(' | ');
              throw new Error(`RAILWAY_GRAPHQL_ERROR:${response.status}:${messages || 'unknown'}`);
            }
            return body.data;
          }

          const input = {
            healthcheckPath: '/health',
            healthcheckTimeout: 120,
            restartPolicyType: 'ON_FAILURE',
            multiRegionConfig: {
              'asia-southeast1-eqsg3a': { numReplicas: 1 },
            },
          };
          await gql(
            'mutation($environmentId: String!, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }',
            {
              environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
              serviceId: process.env.RAILWAY_SERVICE_ID,
              input,
            },
          );
          console.log('service_runtime_configured=true');
          NODE

      - name: Deploy exact repository revision
        shell: bash
        run: |
          set -euo pipefail
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --ci

      - name: Ensure Railway public domain exists
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          railway domain list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --json > /tmp/domains.json || printf '[]' > /tmp/domains.json
          DOMAIN="$(jq -r '.. | strings | select(test("\\.up\\.railway\\.app$"))' /tmp/domains.json | head -n 1)"
          if [ -z "$DOMAIN" ]; then
            railway domain \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --json > /tmp/domain-create.json
            DOMAIN="$(jq -r '.. | strings | select(test("\\.up\\.railway\\.app$"))' /tmp/domain-create.json | head -n 1)"
          fi
          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          test -n "$DOMAIN" || { echo "RAILWAY_DOMAIN_NOT_FOUND" >&2; exit 1; }
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Railway domain: https://$DOMAIN"

      - name: Verify live read-only health contract
        shell: bash
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if BODY="$(curl -fsS --max-time 10 "https://$DOMAIN/health" 2>/dev/null)" && \
               printf '%s' "$BODY" | jq -e '.ok == true and .mode == "READ_ONLY" and .submit_capability == false and .payment_capability == false' >/dev/null; then
              printf '%s\n' "$BODY" | jq .
              echo "LIVE_READONLY_HEALTH_PASS"
              exit 0
            fi
            sleep 5
          done
          echo "LIVE_READONLY_HEALTH_FAIL" >&2
          exit 1

      - name: Verify live QR-only iPhone auth portal
        shell: bash
        env:
          DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 -D /tmp/auth-headers.txt "https://$DOMAIN/auth" -o /tmp/auth-page.html
          PAGE="$(cat /tmp/auth-page.html)"
          printf '%s' "$PAGE" | grep -F '12306 扫码登录' >/dev/null
          printf '%s' "$PAGE" | grep -F '选择“相册”' >/dev/null
          printf '%s' "$PAGE" | grep -F '无需输入 12306 账号或密码' >/dev/null
          printf '%s' "$PAGE" | grep -F '<script src="/auth/app.js" defer></script>' >/dev/null
          tr -d '\r' < /tmp/auth-headers.txt | grep -i '^content-security-policy:' | grep -F "script-src 'self'" >/dev/null
          if tr -d '\r' < /tmp/auth-headers.txt | grep -i '^content-security-policy:' | grep -F "script-src 'unsafe-inline'" >/dev/null; then
            echo "LIVE_QR_PORTAL_INLINE_SCRIPT_CSP_PRESENT" >&2
            exit 1
          fi
          if printf '%s' "$PAGE" | grep -F 'id="username"' >/dev/null; then
            echo "LIVE_QR_PORTAL_USERNAME_FORM_PRESENT" >&2
            exit 1
          fi
          if printf '%s' "$PAGE" | grep -F 'id="password"' >/dev/null; then
            echo "LIVE_QR_PORTAL_PASSWORD_FORM_PRESENT" >&2
            exit 1
          fi
          if printf '%s' "$PAGE" | grep -F 'id="smsCode"' >/dev/null; then
            echo "LIVE_QR_PORTAL_SMS_FORM_PRESENT" >&2
            exit 1
          fi
          curl -fsS --max-time 10 "https://$DOMAIN/auth/app.js" -o /tmp/auth-app.js
          grep -F '__RAIL12306_AUTH_APP_BOOT' /tmp/auth-app.js >/dev/null
          grep -F 'storageGet' /tmp/auth-app.js >/dev/null
          node --check /tmp/auth-app.js
          echo "LIVE_QR_ONLY_AUTH_PORTAL_PASS"
