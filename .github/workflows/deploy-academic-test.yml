name: Deploy Academic Test Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/academic-evidence-capability
    paths:
      - .github/workflows/deploy-academic-test.yml
      - wrangler.academic-test.jsonc
      - ACADEMIC_DEPLOY_TRIGGER
      - scripts/research-mcp-live-smoke.mjs

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      RESEARCH_CONTACT_EMAIL: ${{ secrets.RESEARCH_CONTACT_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy isolated academic test Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy --config wrangler.academic-test.jsonc

      - name: Report research credential readiness
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$OPENALEX_API_KEY" ]; then echo "OPENALEX_API_KEY_CONFIGURED=true"; else echo "OPENALEX_API_KEY_CONFIGURED=false"; fi
          if [ -n "$SEMANTIC_SCHOLAR_API_KEY" ]; then echo "SEMANTIC_SCHOLAR_API_KEY_CONFIGURED=true"; else echo "SEMANTIC_SCHOLAR_API_KEY_CONFIGURED=false"; fi
          if [ -n "$RESEARCH_CONTACT_EMAIL" ]; then echo "RESEARCH_CONTACT_EMAIL_CONFIGURED=true"; else echo "RESEARCH_CONTACT_EMAIL_CONFIGURED=false"; fi

      - name: Sync OpenAlex API key to test Worker
        if: ${{ env.OPENALEX_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$OPENALEX_API_KEY" | npx wrangler secret put OPENALEX_API_KEY --config wrangler.academic-test.jsonc

      - name: Sync Semantic Scholar API key to test Worker
        if: ${{ env.SEMANTIC_SCHOLAR_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$SEMANTIC_SCHOLAR_API_KEY" | npx wrangler secret put SEMANTIC_SCHOLAR_API_KEY --config wrangler.academic-test.jsonc

      - name: Sync research contact email to test Worker
        if: ${{ env.RESEARCH_CONTACT_EMAIL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RESEARCH_CONTACT_EMAIL" | npx wrangler secret put CONTACT_EMAIL --config wrangler.academic-test.jsonc

      - name: Show isolated deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          echo "ACADEMIC_TEST_DEPLOYMENT_URL=$DEPLOYMENT_URL"

      - name: Remote MCP academic smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          MCP_ENDPOINT="${DEPLOYMENT_URL%/}/mcp" node scripts/research-mcp-live-smoke.mjs
