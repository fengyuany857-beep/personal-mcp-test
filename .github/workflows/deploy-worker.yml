name: Deploy Personal MCP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/personal-mcp-hub
    paths:
      - DEPLOY_TRIGGER

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync relay secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUB_RELAY_TOKEN: ${{ secrets.HUB_RELAY_TOKEN }}
        run: |
          test -n "$HUB_RELAY_TOKEN"
          printf '%s' "$HUB_RELAY_TOKEN" | npx wrangler secret put HUB_RELAY_TOKEN

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "deployment_url=${DEPLOYMENT_URL}"
