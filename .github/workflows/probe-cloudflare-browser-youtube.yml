name: Probe Cloudflare Browser YouTube

on:
  workflow_dispatch:
  push:
    branches:
      - feat/academic-evidence-capability
    paths:
      - .github/workflows/probe-cloudflare-browser-youtube.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build isolated Browser Run probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lattice-video-browser-probe
          mkdir -p /tmp/lattice-video-browser-probe/src
          cat > /tmp/lattice-video-browser-probe/package.json <<'JSON'
          {
            "name": "lattice-video-browser-probe",
            "private": true,
            "type": "module",
            "dependencies": {
              "@cloudflare/puppeteer": "1.1.0"
            },
            "devDependencies": {
              "wrangler": "4.131.2"
            }
          }
          JSON
          cat > /tmp/lattice-video-browser-probe/wrangler.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "lattice-video-browser-probe",
            "main": "src/index.js",
            "compatibility_date": "2026-09-29",
            "browser": {
              "binding": "BROWSER"
            }
          }
          JSON
          cat > /tmp/lattice-video-browser-probe/src/index.js <<'JS'
          import puppeteer from "@cloudflare/puppeteer";

          const VIDEO_ID = "teKcE8YhLhA";
          const WATCH_URL = "https://www.youtube.com/watch?v=" + VIDEO_ID;

          function summarizeUrl(raw) {
            try {
              const url = new URL(raw);
              return {
                host: url.hostname,
                path: url.pathname,
                itag: url.searchParams.get("itag"),
                mime: url.searchParams.get("mime"),
                hasPot: url.searchParams.has("pot"),
              };
            } catch {
              return { host: null, path: null, itag: null, mime: null, hasPot: false };
            }
          }

          export default {
            async fetch(_request, env) {
              let browser;
              const media = [];
              try {
                browser = await puppeteer.launch(env.BROWSER);
                const page = await browser.newPage();
                const transcriptNetwork = [];
                page.on("response", async (res) => {
                  const url = res.url();
                  if (!/youtubei\/v1\/get_transcript/i.test(url)) return;
                  try {
                    const text = await res.text();
                    transcriptNetwork.push({
                      status: res.status(),
                      contentType: res.headers()["content-type"] ?? null,
                      length: text.length,
                      sample: text.slice(0, 8000),
                    });
                  } catch (error) {
                    transcriptNetwork.push({
                      status: res.status(),
                      length: 0,
                      error: String(error).slice(0, 500),
                    });
                  }
                });
                await page.setUserAgent(
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                  "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
                );

                page.on("request", (req) => {
                  const url = req.url();
                  if (/googlevideo\.com\/videoplayback/i.test(url)) {
                    if (!media.includes(url) && media.length < 12) media.push(url);
                  }
                });

                const response = await page.goto(WATCH_URL, {
                  waitUntil: "domcontentloaded",
                  timeout: 30000,
                });
                await new Promise((resolve) => setTimeout(resolve, 2500));

                const pageState = await page.evaluate(() => {
                  const body = document.body?.innerText ?? "";
                  const initial = globalThis.ytInitialPlayerResponse ?? null;
                  const tracks =
                    initial?.captions?.playerCaptionsTracklistRenderer?.captionTracks ?? [];
                  return {
                    title: document.title,
                    bodySample: body.slice(0, 800),
                    playability: initial?.playabilityStatus?.status ?? null,
                    playabilityReason: initial?.playabilityStatus?.reason ?? null,
                    captionTracks: tracks.map((track) => ({
                      languageCode: track.languageCode ?? null,
                      kind: track.kind ?? null,
                      baseUrl: track.baseUrl ?? null,
                    })),
                    streamingFormats:
                      (initial?.streamingData?.adaptiveFormats?.length ?? 0) +
                      (initial?.streamingData?.formats?.length ?? 0),
                  };
                });

                let uiTranscriptProbe = null;
                try {
                  const expand = await page.$("#description-inline-expander #expand");
                  if (expand) {
                    await expand.click();
                    await new Promise((resolve) => setTimeout(resolve, 800));
                  }

                  const clickResult = await page.evaluate(() => {
                    const candidates = Array.from(
                      document.querySelectorAll(
                        'button, tp-yt-paper-button, yt-button-shape button, ytd-button-renderer button'
                      )
                    );
                    const target = candidates.find((el) => {
                      const text = (el.textContent ?? "").replace(/\s+/g, " ").trim();
                      const aria = el.getAttribute?.("aria-label") ?? "";
                      return /show transcript/i.test(text) || /show transcript/i.test(aria);
                    });
                    if (!target) return { clicked: false, candidateTexts: candidates.map((el) => (el.textContent ?? "").trim()).filter(Boolean).filter((t) => /transcript/i.test(t)).slice(0, 20) };
                    target.click();
                    return { clicked: true, text: (target.textContent ?? "").trim(), aria: target.getAttribute?.("aria-label") ?? null };
                  });

                  try {
                    await page.waitForSelector(
                      "ytd-transcript-segment-renderer, ytd-engagement-panel-section-list-renderer[target-id='engagement-panel-searchable-transcript']",
                      { timeout: 10000 }
                    );
                  } catch {}
                  await new Promise((resolve) => setTimeout(resolve, 1200));

                  const transcriptDom = await page.evaluate(() => {
                    const rows = Array.from(
                      document.querySelectorAll(
                        "ytd-transcript-segment-renderer, ytd-transcript-segment-list-renderer [role=listitem]"
                      )
                    );
                    const segments = rows.map((row) => {
                      const time =
                        row.querySelector(".segment-timestamp")?.textContent?.trim() ??
                        row.querySelector("[class*=timestamp]")?.textContent?.trim() ??
                        "";
                      const text =
                        row.querySelector(".segment-text")?.textContent?.trim() ??
                        row.querySelector("yt-formatted-string")?.textContent?.trim() ??
                        row.textContent?.replace(/\s+/g, " ").trim() ??
                        "";
                      return { time, text };
                    }).filter((item) => item.text);

                    const transcriptNodes = Array.from(document.querySelectorAll("*"))
                      .filter((node) => /transcript/i.test(node.tagName ?? ""))
                      .slice(0, 40)
                      .map((node) => ({
                        tag: node.tagName,
                        text: (node.textContent ?? "").replace(/\s+/g, " ").trim().slice(0, 500),
                      }));

                    return {
                      segments,
                      transcriptNodes,
                      bodyHasTranscript: /transcript/i.test(document.body?.innerText ?? ""),
                    };
                  });

                  uiTranscriptProbe = {
                    clickResult,
                    segmentCount: transcriptDom.segments.length,
                    segments: transcriptDom.segments.slice(0, 3000),
                    transcriptNodes: transcriptDom.transcriptNodes.slice(0, 20),
                    bodyHasTranscript: transcriptDom.bodyHasTranscript,
                    networkResponses: transcriptNetwork,
                  };
                } catch (error) {
                  uiTranscriptProbe = {
                    error: String(error).slice(0, 500),
                    segmentCount: 0,
                    segments: [],
                    networkResponses: transcriptNetwork,
                  };
                }

                let captionProbe = null;
                const firstCaption = pageState.captionTracks.find((track) => track.baseUrl)?.baseUrl;
                if (firstCaption) {
                  captionProbe = await page.evaluate(async (baseUrl) => {
                    const variants = [];
                    for (const fmt of ["json3", "vtt", "srv3", "ttml"]) {
                      try {
                        const url = new URL(baseUrl);
                        url.searchParams.set("fmt", fmt);
                        const res = await fetch(url.toString(), {
                          credentials: "include",
                          headers: { Accept: "*/*" },
                        });
                        const text = await res.text();
                        variants.push({
                          fmt,
                          ok: res.ok,
                          status: res.status,
                          contentType: res.headers.get("content-type"),
                          length: text.length,
                          sample: text.slice(0, 1600),
                        });
                      } catch (error) {
                        variants.push({
                          fmt,
                          ok: false,
                          status: 0,
                          length: 0,
                          error: String(error).slice(0, 300),
                        });
                      }
                    }
                    return { variants };
                  }, firstCaption);
                }

                try {
                  await page.evaluate(() => {
                    const button =
                      document.querySelector(".ytp-large-play-button") ||
                      document.querySelector("button.ytp-play-button");
                    if (button) button.click();
                  });
                  await new Promise((resolve) => setTimeout(resolve, 8000));
                } catch {}

                const mediaSummary = media.map(summarizeUrl);
                const candidateIndex = media.findIndex((url) => {
                  const decoded = decodeURIComponent(url);
                  return /mime=audio\//i.test(decoded) || /[?&]itag=(139|140|141|249|250|251)(?:&|$)/.test(url);
                });
                const candidate = candidateIndex >= 0 ? media[candidateIndex] : media[0];

                let browserMediaProbe = null;
                let workerMediaProbe = null;
                if (candidate) {
                  browserMediaProbe = await page.evaluate(async (url) => {
                    try {
                      const res = await fetch(url, { headers: { Range: "bytes=0-65535" } });
                      const buf = await res.arrayBuffer();
                      return {
                        ok: res.ok,
                        status: res.status,
                        bytes: buf.byteLength,
                        contentType: res.headers.get("content-type"),
                      };
                    } catch (error) {
                      return { ok: false, status: 0, bytes: 0, error: String(error).slice(0, 300) };
                    }
                  }, candidate);

                  try {
                    const res = await fetch(candidate, {
                      headers: {
                        Range: "bytes=0-65535",
                        Referer: WATCH_URL,
                        "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",
                      },
                    });
                    const buf = await res.arrayBuffer();
                    workerMediaProbe = {
                      ok: res.ok,
                      status: res.status,
                      bytes: buf.byteLength,
                      contentType: res.headers.get("content-type"),
                    };
                  } catch (error) {
                    workerMediaProbe = {
                      ok: false,
                      status: 0,
                      bytes: 0,
                      error: String(error).slice(0, 300),
                    };
                  }
                }

                const bodyLower = String(pageState.bodySample).toLowerCase();
                const botBlocked =
                  bodyLower.includes("confirm you’re not a bot") ||
                  bodyLower.includes("confirm you're not a bot") ||
                  bodyLower.includes("unusual traffic") ||
                  bodyLower.includes("sign in to confirm");

                return Response.json({
                  ok: true,
                  navigationStatus: response?.status() ?? null,
                  botBlocked,
                  page: {
                    title: pageState.title,
                    playability: pageState.playability,
                    playabilityReason: pageState.playabilityReason,
                    captionTracks: pageState.captionTracks.map(({ languageCode, kind }) => ({
                      languageCode,
                      kind,
                    })),
                    streamingFormats: pageState.streamingFormats,
                  },
                  uiTranscriptProbe,
                  captionProbe,
                  mediaCount: media.length,
                  media: mediaSummary,
                  browserMediaProbe,
                  workerMediaProbe,
                });
              } catch (error) {
                return Response.json(
                  { ok: false, error: error instanceof Error ? error.message : String(error) },
                  { status: 500 }
                );
              } finally {
                if (browser) {
                  try { await browser.close(); } catch {}
                }
              }
            },
          };
          JS
          cd /tmp/lattice-video-browser-probe
          npm install --no-audit --no-fund

      - name: Deploy isolated Browser Run probe
        working-directory: /tmp/lattice-video-browser-probe
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc

      - name: Run target video probe
        shell: bash
        run: |
          set -euo pipefail
          url="https://lattice-video-browser-probe.3254849126a.workers.dev"
          rm -f /tmp/browser-probe.json
          status=""
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl -sS --max-time 70 -o /tmp/browser-probe.json -w '%{http_code}' "$url" || true)"
            echo "BROWSER_PROBE_HTTP attempt=$attempt status=$status"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 3
          done
          test "$status" = "200"
          cat /tmp/browser-probe.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/browser-probe.json"))
          print("\nBROWSER_PROBE_SUMMARY", json.dumps({
              "ok": data.get("ok"),
              "botBlocked": data.get("botBlocked"),
              "page": data.get("page"),
              "uiTranscriptProbe": {
                  "segmentCount": (data.get("uiTranscriptProbe") or {}).get("segmentCount"),
                  "clickResult": (data.get("uiTranscriptProbe") or {}).get("clickResult"),
                  "sample": ((data.get("uiTranscriptProbe") or {}).get("segments") or [])[:8],
                  "networkResponses": (data.get("uiTranscriptProbe") or {}).get("networkResponses"),
              },
              "captionProbe": data.get("captionProbe"),
              "mediaCount": data.get("mediaCount"),
              "browserMediaProbe": data.get("browserMediaProbe"),
              "workerMediaProbe": data.get("workerMediaProbe"),
          }, ensure_ascii=False))
          if not data.get("ok"):
              raise SystemExit("BROWSER_PROBE=FAIL worker error")
          if data.get("botBlocked"):
              raise SystemExit("BROWSER_PROBE=FAIL YouTube bot wall")
          ui_segments=(data.get("uiTranscriptProbe") or {}).get("segments") or []
          variants=(data.get("captionProbe") or {}).get("variants") or []
          network=(data.get("uiTranscriptProbe") or {}).get("networkResponses") or []
          caption_ok=(
              len(ui_segments) >= 3
              or any(r.get("status")==200 and r.get("length",0) > 200 for r in network)
              or any(v.get("ok") and v.get("length",0) > 100 for v in variants)
          )
          if not caption_ok and not (
              (data.get("browserMediaProbe") or {}).get("bytes",0) > 4096
              or (data.get("workerMediaProbe") or {}).get("bytes",0) > 4096
          ):
              raise SystemExit("BROWSER_PROBE=FAIL no readable captions or media bytes")
          print("BROWSER_PROBE=PASS")
          PY

      - name: Delete isolated probe Worker
        if: always()
        working-directory: /tmp/lattice-video-browser-probe
        shell: bash
        run: |
          npx wrangler delete --name lattice-video-browser-probe --force || true
