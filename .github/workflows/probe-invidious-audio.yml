name: Probe Invidious Audio Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - feat/academic-evidence-capability
    paths:
      - .github/workflows/probe-invidious-audio.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Probe official public instances
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, ssl, urllib.request, urllib.error, urllib.parse

          video_id = "teKcE8YhLhA"
          instances = [
              "https://inv.nadeko.net",
              "https://invidious.nerdvpn.de",
              "https://yt.chocolatemoo53.com",
              "https://invidious.tiekoetter.com",
          ]

          def fetch(url, headers=None, timeout=20):
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, dict(r.headers), r.read()

          passes = []
          for base in instances:
              print("INSTANCE", base)
              try:
                  status, headers, body = fetch(f"{base}/api/v1/videos/{video_id}?local=true")
                  data = json.loads(body)
                  formats = [
                      f for f in (data.get("adaptiveFormats") or [])
                      if str(f.get("type") or f.get("mimeType") or "").startswith("audio/")
                  ]
                  print(" API", status, "title=", str(data.get("title"))[:80], "audio_formats=", len(formats))
                  if not formats:
                      continue

                  # Prefer a low-bitrate audio representation for a bounded byte probe.
                  formats.sort(key=lambda f: int(f.get("bitrate") or 10**12))
                  for fmt in formats[:4]:
                      raw_url = fmt.get("url") or ""
                      if not raw_url:
                          continue
                      if raw_url.startswith("/"):
                          media_url = base + raw_url
                      else:
                          media_url = raw_url
                      parsed = urllib.parse.urlparse(media_url)
                      print("  FORMAT host=", parsed.hostname, "path=", parsed.path[:80], "itag=", fmt.get("itag"))
                      try:
                          req = urllib.request.Request(
                              media_url,
                              headers={
                                  "User-Agent":"Mozilla/5.0",
                                  "Range":"bytes=0-65535",
                              },
                          )
                          with urllib.request.urlopen(req, timeout=20) as r:
                              chunk = r.read(65536)
                              ctype = r.headers.get("content-type","")
                              print("   BYTE_PROBE", r.status, "bytes=", len(chunk), "ctype=", ctype)
                              if len(chunk) > 4096:
                                  passes.append((base, media_url, len(chunk), ctype))
                                  break
                      except Exception as e:
                          print("   BYTE_PROBE_FAIL", type(e).__name__, str(e)[:180])
              except Exception as e:
                  print(" API_FAIL", type(e).__name__, str(e)[:220])

          if not passes:
              raise SystemExit("INVIDIOUS_PROXY=FAIL no instance returned readable target audio bytes")
          print("INVIDIOUS_PROXY=PASS", [(p[0], p[2], p[3]) for p in passes])
          PY
