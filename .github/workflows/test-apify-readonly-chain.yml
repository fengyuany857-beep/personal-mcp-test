name: Test Apify Read-only Chain

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-mcp-hub
    paths:
      - APIFY_CHAIN_TRIGGER

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Search Actors then fetch details without running Actors
        run: node scripts/apify-readonly-chain.mjs
