name: Test Remote MCP Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - TEST_TRIGGER

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run independent MCP test
        env:
          MCP_ENDPOINT: https://personal-mcp-test.3254849126a.workers.dev/mcp
        run: node scripts/remote-mcp-test.mjs
