name: Test 12306 Ticket Capability

on:
  push:
    branches:
      - feat/12306-ticket-capability
  pull_request:
    paths:
      - "src/ticket/**"
      - "runner/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-ticket-capability.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from pinned package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const lock=require('./package-lock.json'); if (lock.lockfileVersion < 1) process.exit(1); console.log('lockfileVersion='+lock.lockfileVersion)"
      - name: Run Phase 3 regression tests
        run: npm test
      - name: Preserve regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
