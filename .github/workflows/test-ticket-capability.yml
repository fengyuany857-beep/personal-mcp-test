name: Test 12306 Ticket Capability

on:
  push:
    branches:
      - feat/12306-ticket-capability
  pull_request:
    paths:
      - "src/ticket/**"
      - "runner/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-ticket-capability.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify lockfile
        run: |
          node --version
          npm --version
          test -f package-lock.json
          node -e "const lock=require('./package-lock.json'); if (lock.lockfileVersion < 1) process.exit(1); console.log('lockfileVersion='+lock.lockfileVersion)"
      - run: npm ci
      - run: npm test
