name: Test 12306 Ticket Capability

on:
  push:
    branches:
      - feat/12306-ticket-capability
  pull_request:
    paths:
      - "src/ticket/**"
      - "runner/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-ticket-capability.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
